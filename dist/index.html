<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>皇家 3D 賭場總匯 - Royal 3D Casino</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Montserrat:wght@400;600;800&family=Orbitron:wght@500;800&display=swap" rel="stylesheet">
<style>
/* base.css — 全域樣式：大廳氛圍、頂欄、側欄、籌碼、按鈕、特效 */
:root {
  --gold: #d4af37; --gold-l: #fcf6ba; --gold-d: #8f5f10;
  --ink: #06070b; --panel: rgba(14, 17, 28, .82); --line: rgba(212, 175, 55, .3);
  --felt: #0d6a33; --felt-d: #04301a; --txt: #eef0f6; --mut: #98a1b6;
  --f-ui: 'Montserrat', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif;
  --f-title: 'Cinzel', 'Noto Serif TC', serif;
  --f-led: 'Orbitron', 'Courier New', monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  font-family: 'Montserrat', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif;
  color: var(--txt); background: #05060a; overflow: hidden; user-select: none;
  display: flex; flex-direction: column; height: 100vh;   /* 桌機：整頁固定在視窗內，不出現捲軸 */
}
/* 賭場地毯 + 天花板射燈 */
body::before {
  content: ''; position: fixed; inset: 0; z-index: -2;
  background:
    radial-gradient(circle at 25% 25%, rgba(212, 175, 55, .13) 0 2px, transparent 3px),
    radial-gradient(circle at 75% 75%, rgba(212, 175, 55, .13) 0 2px, transparent 3px),
    linear-gradient(45deg, rgba(120, 20, 45, .22) 25%, transparent 25% 75%, rgba(120, 20, 45, .22) 75%),
    linear-gradient(135deg, #1d0a14, #0a0c1b);
  background-size: 44px 44px, 44px 44px, 44px 44px, auto;
}
body::after {
  content: ''; position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background:
    radial-gradient(ellipse 38% 55% at 20% -5%, rgba(255, 226, 150, .2), transparent 70%),
    radial-gradient(ellipse 38% 55% at 80% -5%, rgba(255, 226, 150, .2), transparent 70%),
    radial-gradient(ellipse 90% 80% at 50% 45%, transparent 35%, rgba(0, 0, 0, .78) 100%);
}
button { font-family: inherit; cursor: pointer; color: inherit; }
.gold-text {
  background: linear-gradient(135deg, #bf953f 0%, #fcf6ba 25%, #b38728 50%, #fbf5b7 75%, #aa771c 100%);
  -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: transparent;
}

/* ---------- 頂欄 ---------- */
.topbar {
  position: sticky; top: 0; z-index: 40; display: flex; justify-content: space-between; align-items: center;
  flex-wrap: wrap; gap: 8px; padding: 10px 18px;
  background: linear-gradient(180deg, #1b1408 0%, #0a0805 100%);
  border-bottom: 2px solid var(--gold-d);
  box-shadow: 0 6px 24px rgba(0, 0, 0, .8), inset 0 1px 0 rgba(255, 230, 150, .35), 0 1px 0 #000;
}
.brand { display: flex; align-items: center; gap: 12px; }
.brand h1 { font: 900 24px 'Cinzel', serif; letter-spacing: .12em; }
.brand p { font-size: 12px; color: var(--mut); }
.logo {
  width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; font-size: 24px; color: #2a1a00;
  background: radial-gradient(circle at 35% 30%, #fff6c0, #d4af37 45%, #7c5208);
  box-shadow: 0 3px 0 #5a3b05, 0 6px 12px rgba(0, 0, 0, .7), inset 0 -3px 5px rgba(0, 0, 0, .35);
}
.burger { display: none; background: none; border: 0; font-size: 26px; color: var(--gold); padding: 0 6px; }
.top-right { display: flex; align-items: center; gap: 10px; }
.icon-btn {
  width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--line); font-size: 17px; color: var(--gold);
  background: linear-gradient(180deg, #2a2a33, #111118); box-shadow: 0 3px 0 #000, inset 0 1px 0 rgba(255, 255, 255, .15);
}
.icon-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #000; }
.wallet {
  display: flex; flex-direction: column; align-items: flex-end; padding: 4px 14px; border-radius: 10px;
  background: #020403; border: 1px solid #3b3416; box-shadow: inset 0 0 12px #000, 0 0 0 2px #1a160a;
}
.wallet small { font-size: 10px; letter-spacing: .12em; color: #8a7a3a; font-weight: 800; }
.wallet b {
  font: 800 26px 'Orbitron', monospace; color: #52ff8a; text-shadow: 0 0 10px rgba(82, 255, 138, .75);
}
.wallet b.up { animation: wUp .8s; }
.wallet b.down { animation: wDown .5s; }
@keyframes wUp { 0%, 100% { color: #52ff8a; } 30% { color: #fff; text-shadow: 0 0 18px #fff; transform: scale(1.12); } }
@keyframes wDown { 30% { color: #ff6a6a; text-shadow: 0 0 12px #f33; } }

/* ---------- 主架構 ---------- */
.app { display: flex; gap: 16px; width: 100%; margin: 0 auto; padding: 10px 16px; flex: 1; min-height: 0; }
.side { width: 270px; min-height: 0; overflow-y: auto; flex: none; display: flex; flex-direction: column; gap: 8px; }
.side h3 { font-size: 12px; letter-spacing: .22em; color: var(--mut); padding: 4px 8px; }
.nav {
  display: flex; align-items: center; gap: 10px; width: 100%; padding: 12px 14px; text-align: left; font-size: 16px; font-weight: 600;
  color: #cfd3e0; border-radius: 12px; border: 1px solid rgba(255, 255, 255, .08);
  background: linear-gradient(180deg, rgba(40, 44, 62, .85), rgba(14, 16, 26, .92));
  box-shadow: 0 4px 0 #05060a, 0 8px 14px rgba(0, 0, 0, .5), inset 0 1px 0 rgba(255, 255, 255, .1);
  transition: transform .15s, box-shadow .15s, color .15s;
}
.nav:hover { transform: translateY(-2px); }
.nav .n { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font: 800 11px Montserrat; color: #1a1200; background: linear-gradient(145deg, #fff0a8, #b98512); flex: none; }
.nav small { display: block; font-size: 11px; color: var(--mut); font-weight: 600; letter-spacing: .06em; }
.nav.on {
  color: var(--gold-l); border-color: var(--gold);
  background: linear-gradient(180deg, #4a3a10, #1d1606);
  box-shadow: 0 2px 0 #05060a, 0 0 18px rgba(212, 175, 55, .45), inset 0 1px 0 rgba(255, 240, 160, .35); transform: translateY(2px);
}
.stage { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: 10px; }
#views {
  flex: 1; position: relative; min-height: 0; border-radius: 20px; overflow: hidden;
  background: radial-gradient(ellipse at 50% 0%, rgba(60, 40, 90, .45), rgba(8, 9, 15, .86) 70%);
  border: 1px solid var(--line); box-shadow: 0 20px 50px rgba(0, 0, 0, .75), inset 0 1px 0 rgba(255, 255, 255, .08);
}
.view { display: none; position: absolute; inset: 0; overflow: hidden; }
.vscene { position: absolute; left: 50%; top: 0; transform-origin: 50% 0; padding: 6px 0 10px; }
.view.on { display: block; animation: viewIn .45s ease; }
.view-title { text-align: center; font: 900 18px var(--f-ui); letter-spacing: .3em; color: #b8c0d6; margin-bottom: 4px; }
.view-title small { display: block; margin-top: 4px; font-size: 14px; letter-spacing: .08em; color: #6f7790; font-weight: 600; }
.fit-box { position: relative; width: 100%; }
.fit-inner { position: absolute; left: 0; right: 0; top: 0; margin: 0 auto; transform-origin: top center; }
@keyframes viewIn { from { opacity: 0; transform: translateY(14px) scale(.985); } }

/* ---------- 底部籌碼列 ---------- */
.bar {
  display: flex; align-items: center; gap: 16px; flex-wrap: wrap; padding: 10px 16px; border-radius: 16px;
  background: linear-gradient(180deg, #2a1e0c, #100b04); border: 1px solid var(--gold-d);
  box-shadow: 0 8px 20px rgba(0, 0, 0, .6), inset 0 1px 0 rgba(255, 220, 130, .3);
}
.chip-row { display: flex; align-items: center; gap: 12px; padding: 2px 4px 8px; }
.status {
  flex: 1; min-width: 220px; padding: 12px 16px; border-radius: 8px; font-size: 17px; font-weight: 700; color: #ffd75e;
  background: #050403; border: 1px solid #2d2610; box-shadow: inset 0 0 14px #000; text-shadow: 0 0 8px rgba(255, 190, 40, .6);
}
.status.warn { color: #ff8a7a; text-shadow: 0 0 8px rgba(255, 80, 60, .6); }
.status.win { color: #7dffa8; text-shadow: 0 0 10px rgba(80, 255, 140, .7); }
.status.pop { animation: statusPop .35s; }
@keyframes statusPop { from { transform: scale(.97); opacity: .4; } }
.foot { display: none; text-align: center; padding: 12px; font-size: 11px; color: #6b7184; background: #040508; border-top: 1px solid rgba(212, 175, 55, .12); }

/* ---------- 3D 籌碼 ---------- */
.chip3d {
  --c: #d62839; --cd: #6e0f1c; --cl: #ff7684;
  position: relative; width: 58px; height: 58px; border-radius: 50%; border: 0; color: #fff; font: 800 15px Montserrat;
  background: repeating-conic-gradient(from -7deg, #fff 0 14deg, var(--c) 14deg 45deg);
  box-shadow: 0 1px 0 var(--cd), 0 2px 0 var(--cd), 0 3px 0 var(--cd), 0 4px 0 var(--cd), 0 5px 0 var(--cd), 0 9px 10px rgba(0, 0, 0, .8);
  transition: transform .18s cubic-bezier(.3, 1.6, .5, 1), box-shadow .18s;
}
.chip3d::before { content: ''; position: absolute; inset: 7px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, var(--cl), var(--c) 72%); border: 2px dashed rgba(255, 255, 255, .8); box-shadow: inset 0 0 8px rgba(0, 0, 0, .45); }
.chip3d span { position: relative; z-index: 1; text-shadow: 0 1px 2px rgba(0, 0, 0, .8); }
.chip3d.c25 { --c: #16974a; --cd: #07471f; --cl: #52e08a; }
.chip3d.c100 { --c: #23262f; --cd: #050608; --cl: #5d6270; }
.chip3d.c500 { --c: #7b2cbf; --cd: #34115a; --cl: #b975f5; }
.chip3d.c1000 { --c: #d4a017; --cd: #6b4a05; --cl: #ffe58a; color: #3a2600; }
.chip3d.c1000 span { text-shadow: 0 1px 0 rgba(255,255,255,.4); }
.chip3d:hover { transform: translateY(-3px); }
.chip3d.active { transform: translateY(-9px) scale(1.14); box-shadow: 0 1px 0 var(--cd), 0 2px 0 var(--cd), 0 3px 0 var(--cd), 0 4px 0 var(--cd), 0 5px 0 var(--cd), 0 16px 16px rgba(0, 0, 0, .8), 0 0 18px rgba(255, 215, 90, .85); }

/* 桌面上的籌碼堆 */
.stk { position: relative; display: inline-flex; align-items: flex-end; gap: 2px; pointer-events: none; }
.stk .col { position: relative; width: 26px; height: calc(26px + var(--h) * 3px); }
.stk .pc {
  --c: #d62839; --cd: #6e0f1c; position: absolute; left: 0; bottom: calc(var(--i) * 3px); width: 26px; height: 26px; border-radius: 50%;
  background: repeating-conic-gradient(from -7deg, #fff 0 14deg, var(--c) 14deg 45deg);
  box-shadow: 0 2px 0 var(--cd), 0 3px 3px rgba(0, 0, 0, .6); display: block;
}
.stk .pc::after { content: ''; position: absolute; inset: 5px; border-radius: 50%; background: var(--c); border: 1px dashed rgba(255, 255, 255, .8); }
.stk .pc.c25 { --c: #16974a; --cd: #07471f; }
.stk .pc.c100 { --c: #23262f; --cd: #050608; }
.stk .pc.c500 { --c: #7b2cbf; --cd: #34115a; }
.stk .pc.c1000 { --c: #d4a017; --cd: #6b4a05; }
.stk .pc.c1 { --c: #8b93a5; --cd: #3b4150; }
.stk-amt {
  position: absolute; left: 50%; top: -15px; transform: translateX(-50%); white-space: nowrap; font: 800 10px Montserrat; color: #111;
  background: linear-gradient(#fff3b0, #d4af37); padding: 1px 6px; border-radius: 8px; box-shadow: 0 1px 3px #000;
}

/* ---------- 3D 按鈕 ---------- */
.btn {
  position: relative; border: 0; border-radius: 12px; padding: 13px 28px; font: 800 18px Montserrat; letter-spacing: .05em; color: #1a1200;
  background: linear-gradient(180deg, #fff2a6, #d4af37 55%, #a8761a); text-shadow: 0 1px 0 rgba(255, 255, 255, .5);
  box-shadow: 0 5px 0 #6b470a, 0 9px 14px rgba(0, 0, 0, .6), inset 0 1px 0 #fff9;
  transition: transform .08s, box-shadow .08s, filter .15s;
}
.btn:hover { filter: brightness(1.1); }
.btn:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 1px 0 #6b470a, 0 3px 6px rgba(0, 0, 0, .6), inset 0 1px 0 #fff9; }
.btn:disabled { filter: grayscale(.9) brightness(.55); cursor: not-allowed; }
.btn.green { color: #fff; background: linear-gradient(180deg, #4be58a, #14a24d 55%, #0b6b32); text-shadow: 0 1px 2px #0008; box-shadow: 0 5px 0 #064a21, 0 9px 14px rgba(0, 0, 0, .6), inset 0 1px 0 #fff6; }
.btn.red { color: #fff; background: linear-gradient(180deg, #ff6f7d, #d02334 55%, #8a0f1c); text-shadow: 0 1px 2px #0008; box-shadow: 0 5px 0 #5c0912, 0 9px 14px rgba(0, 0, 0, .6), inset 0 1px 0 #fff6; }
.btn.dark { color: var(--gold-l); background: linear-gradient(180deg, #3a3f52, #161924 60%, #0b0d14); text-shadow: 0 1px 2px #000; box-shadow: 0 5px 0 #000, 0 9px 14px rgba(0, 0, 0, .6), inset 0 1px 0 #fff3; border: 1px solid var(--line); }
.btn.sm { padding: 10px 18px; font-size: 15px; }
.btn-row { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; align-items: center; margin-top: 14px; }
.hidden { display: none !important; }

/* ---------- 大獎特效 ---------- */
.bigwin { position: fixed; inset: 0; z-index: 90; display: grid; place-items: center; pointer-events: none; background: radial-gradient(circle, rgba(255, 200, 60, .35), rgba(0, 0, 0, .55) 70%); animation: bwIn .4s; overflow: hidden; }
.bigwin.out { opacity: 0; transition: opacity .6s; }
.bw-in { text-align: center; animation: bwPop .7s cubic-bezier(.2, 1.6, .4, 1); }
.bw-in small { display: block; font: 900 clamp(26px, 6vw, 54px) 'Cinzel', serif; letter-spacing: .1em; background: linear-gradient(#fff6b0, #d4af37 60%, #8f5f10); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; filter: drop-shadow(0 4px 0 #3a2504) drop-shadow(0 0 20px rgba(255, 200, 60, .9)); }
.bw-in b { display: block; font: 900 clamp(34px, 9vw, 78px) 'Orbitron', monospace; color: #fff; text-shadow: 0 0 24px #ffd24d, 0 4px 0 #8a5a00; }
@keyframes bwIn { from { opacity: 0; } }
@keyframes bwPop { from { transform: scale(.2) rotate(-8deg); opacity: 0; } }
.rain-coin {
  position: absolute; top: -50px; width: 30px; height: 30px; border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #fff6b0, #e8b923 50%, #8a5a00); border: 2px solid #b98512; box-shadow: inset 0 0 0 4px rgba(255, 255, 255, .15), 0 3px 6px rgba(0, 0, 0, .6);
  animation: coinFall linear forwards;
}
@keyframes coinFall { to { transform: translateY(115vh) rotateX(var(--r)) rotateZ(var(--r)); } }

/* ---------- 遊戲通用 ---------- */
.game-title { text-align: center; font: 900 12px Montserrat; letter-spacing: .3em; color: var(--mut); margin-bottom: 10px; }
.info-card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; font-size: 12px; color: #c9cee0; backdrop-filter: blur(6px); }
.info-card h4 { font: 800 11px Montserrat; letter-spacing: .18em; color: var(--gold); margin-bottom: 8px; }

@media (max-width: 900px) {
  html, body { height: auto; } body { overflow-y: auto; overflow-x: hidden; height: auto; min-height: 100vh; }
  #views { flex: none; min-height: 0; } .view { position: relative; inset: auto; } .vscene { position: absolute; }
  .app { min-height: auto; } .foot { display: block; }
  .burger { display: block; }
  .side { position: fixed; z-index: 60; left: 0; top: 0; bottom: 0; width: 262px; padding: 70px 14px 14px; background: rgba(6, 7, 12, .97); transform: translateX(-104%); transition: transform .3s; box-shadow: 8px 0 30px #000; overflow-y: auto; }
  .side.open { transform: none; }
  .app { padding: 8px; }
  .brand p { display: none; }
  .wallet b { font-size: 15px; }
}

</style>
<style>
/* ===== tables.css : 賭桌 (3D 傾斜絨布桌 / 撲克牌 / 骰子 / 輪盤 / 骰寶) ===== */

/* ---------- 撲克牌 ---------- */
:root{--cw:84px}
.pcard{width:var(--cw);height:calc(var(--cw)*1.42);position:relative;perspective:800px;flex:none;font-size:calc(var(--cw)*.2);color:#15151a;transition:filter .3s,transform .3s}
.pcard.red{color:#c8102e}
.pc-in{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.3,.75,.3,1)}
.pcard.up .pc-in{transform:rotateY(180deg)}
.pc-back,.pc-face{position:absolute;inset:0;border-radius:calc(var(--cw)*.075);backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:0 1px 0 rgba(0,0,0,.45),0 5px 10px rgba(0,0,0,.55)}
.pc-back{border:calc(var(--cw)*.05) solid #f4f1e8;display:grid;place-items:center;
  background:radial-gradient(circle at 50% 50%,rgba(0,0,0,.0) 0 34%,rgba(0,0,0,.18) 100%),repeating-linear-gradient(45deg,#8e1328 0 3px,#5b0a18 3px 6px),#7a0f1d}
.pc-back span{width:42%;aspect-ratio:1;display:grid;place-items:center;border-radius:50%;font-size:1.5em;color:#f1cf6a;background:radial-gradient(circle,#4a0712,#2a030a);box-shadow:0 0 0 2px #f1cf6a,inset 0 0 8px #000}
.pc-face{transform:rotateY(180deg);background:linear-gradient(160deg,#fff 0%,#f6f3ea 60%,#e7e3d6 100%);border:1px solid #c9c4b5}
.pc-idx{position:absolute;display:flex;flex-direction:column;align-items:center;line-height:1}
.pc-idx b{font:800 1.08em/1 'Montserrat',sans-serif}
.pc-idx i{font-style:normal;font-size:.95em;margin-top:.05em}
.pc-idx.tl{left:.36em;top:.3em}
.pc-idx.br{right:.36em;bottom:.3em;transform:rotate(180deg)}
.pc-pips{position:absolute;left:22%;right:22%;top:13%;bottom:13%}
.pc-pips .pip{position:absolute;font-style:normal;font-size:1.4em;line-height:1;transform:translate(-50%,-50%)}
.pc-pips .pip.inv{transform:translate(-50%,-50%) rotate(180deg)}
.pc-ace{position:absolute;inset:0;display:grid;place-items:center;font-size:3.4em;line-height:1}
.pc-court{position:absolute;inset:10% 19%;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:.15em 0;border:1.5px solid currentColor;border-radius:4px;
  background:linear-gradient(135deg,rgba(212,175,55,.34),rgba(212,175,55,.08) 60%,rgba(212,175,55,.28))}
.pc-court em{font-style:normal;font-size:1em;line-height:1}.pc-court em.inv{transform:rotate(180deg)}
.pc-court span{font-size:2.6em;line-height:1;filter:drop-shadow(0 2px 0 rgba(0,0,0,.2))}
.pcard.dim{filter:brightness(.55) saturate(.7)}
.pcard.win .pc-face{box-shadow:0 0 0 2px #ffe27a,0 0 18px 4px rgba(255,220,100,.9),0 5px 10px rgba(0,0,0,.55)}
.hand{display:flex;justify-content:center;align-items:center;gap:calc(var(--cw)*.14);min-height:calc(var(--cw)*1.42)}

/* ---------- 3D 傾斜賭桌 (木框 + 皮墊 + 絨布) ---------- */
.tbl-scene{container-type:inline-size;position:relative;padding:6px 0 30px}
.tbl-persp{perspective:1250px;perspective-origin:50% 8%}
.tbl{--r:220px;--tilt:34deg;position:relative;margin:0 auto;width:min(100%,1000px);aspect-ratio:16/9.4;transform-style:preserve-3d;transform:rotateX(var(--tilt))}
.tbl-rail{position:absolute;inset:0;border-radius:var(--r);transform-style:preserve-3d;
  background:linear-gradient(160deg,#8a4b1f 0%,#4d2308 40%,#2b1204 100%);
  box-shadow:inset 0 3px 0 rgba(255,210,150,.45),inset 0 -6px 12px rgba(0,0,0,.6),0 30px 40px rgba(0,0,0,.7)}
.tbl-rail::before{content:"";position:absolute;inset:0;border-radius:inherit;background:repeating-linear-gradient(100deg,rgba(255,255,255,.04) 0 3px,transparent 3px 11px,rgba(0,0,0,.08) 11px 14px);mix-blend-mode:overlay}
.tbl-pad{position:absolute;inset:3.2% 2.2%;border-radius:calc(var(--r) - 3%);transform:translateZ(5px);transform-style:preserve-3d;
  background:linear-gradient(160deg,#2a2a32,#0d0d11);box-shadow:inset 0 0 0 2px #000,inset 0 3px 0 rgba(255,255,255,.18),0 3px 6px rgba(0,0,0,.6)}
.tbl-pad::after{content:"";position:absolute;inset:6px;border-radius:inherit;border:1.5px dashed rgba(230,200,140,.45)}
.tbl-felt{position:absolute;inset:7.4% 5.2%;border-radius:calc(var(--r) - 8%);transform:translateZ(3px);transform-style:preserve-3d;
  background:radial-gradient(ellipse at 50% 42%,#1f8a4a 0%,#12683a 45%,#0a4526 100%);box-shadow:inset 0 0 70px rgba(0,0,0,.75),inset 0 0 0 2px rgba(0,0,0,.5)}

/* core.js — 共用核心：錢包、籌碼列、通知、縮放/傾斜、大獎特效、遊戲註冊
   所有模組透過全域 window.Casino (簡寫 C) 溝通。載入順序：core → audio → cards → poker-eval → 各遊戲 → main */
(function () {
  'use strict';
  const C = (window.Casino = { games: [], CHIPS: [5, 25, 100, 500, 1000], state: { wallet: 1000, chip: 25 }, _w: [], _c: [] });

  /* ---------- 小工具 ---------- */

  C.el = function (html) { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; };
  C.sleep = ms => new Promise(r => setTimeout(r, ms));
  C.mod = (a, n) => ((a % n) + n) % n;
  C.rnd = function (n) {                       // 0..n-1，優先使用密碼學亂數 (無取模偏差)
    try {
      const a = new Uint32Array(1), lim = Math.floor(4294967296 / n) * n; let x;
      do { crypto.getRandomValues(a); x = a[0]; } while (x >= lim);
      return x % n;
    } catch (e) { return Math.floor(Math.random() * n); }
  };
  C.rand = C.rnd;
  C.pick = a => a[C.rnd(a.length)];
  C.shuffle = function (a) { for (let i = a.length - 1; i > 0; i--) { const j = C.rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  C.fmt = n => '$' + Math.round(n).toLocaleString('en-US');
  C.ease = { out3: t => 1 - Math.pow(1 - t, 3), out4: t => 1 - Math.pow(1 - t, 4), out2: t => 1 - (1 - t) * (1 - t), io: t => (t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2) };

  /* ---------- 錢包 ---------- */
  try { const v = parseInt(localStorage.getItem('royal_casino_wallet'), 10); if (v > 0) C.state.wallet = v; } catch (e) {}
  const save = () => { try { localStorage.setItem('royal_casino_wallet', C.state.wallet); } catch (e) {} };
  let shown = C.state.wallet, raf = 0;

  C.onWallet = fn => C._w.push(fn);
  C.onChip = fn => C._c.push(fn);

  C.updateWallet = function (dir) {
    const el = C.$('#wallet');
    if (el) {
      cancelAnimationFrame(raf);
      const from = shown, to = C.state.wallet, t0 = performance.now();
      if (dir) { el.classList.remove('up', 'down'); void el.offsetWidth; el.classList.add(dir); }
      (function step(t) {
        const p = Math.min(1, (t - t0) / 600);
        shown = Math.round(from + (to - from) * C.ease.out3(p));
        el.textContent = C.fmt(shown);
        if (p < 1) raf = requestAnimationFrame(step);
      })(t0);
    }
    C._w.forEach(f => { try { f(C.state.wallet); } catch (e) { console.error(e); } });
  };
  C.earn = function (n) { if (n <= 0) return; C.state.wallet += Math.round(n); save(); C.updateWallet('up'); };
  C.spend = function (n) {
    if (n > C.state.wallet) { C.notify('餘額不足！請降低下注額，或按右上角 ⟳ 補充籌碼。', 'warn'); C.sfx('deny'); return false; }
    if (n <= 0) return true;
    C.state.wallet -= Math.round(n); save(); C.updateWallet('down'); return true;
  };
  C.refill = function () {
    C.state.wallet = 1000; save(); C.updateWallet('up'); C.sfx('chips'); C.notify('籌碼已重新補充至 $1,000！');

  /* ---------- 通知列 ---------- */

    s.textContent = msg; s.className = 'status' + (kind ? ' ' + kind : '');

  /* ---------- 籌碼列 ---------- */
  C.buildChipRow = function () {
    const row = C.$('#chipRow'); row.innerHTML = '';

  };
  C.setChip = function (v, silent) {
    C.state.chip = v;
    C.$$('#chipRow .chip3d').forEach(b => b.classList.toggle('active', +b.dataset.v === v));
    if (!silent) C.sfx('chip');
    C._c.forEach(f => { try { f(v); } catch (e) { console.error(e); } });
  };
  C.cycleChip = function () { C.setChip(C.CHIPS[C.mod(C.CHIPS.indexOf(C.state.chip) + 1, C.CHIPS.length)]); };

  /* 桌面籌碼堆 (HTML 字串) */
  C.chipStack = function (amount) {
    if (!amount) return '';
    let rem = amount, cols = '';
    for (const d of [1000, 500, 100, 25, 5, 1]) {
      const n = Math.floor(rem / d); rem -= n * d; if (!n) continue;
      const shown = Math.min(n, 8); let pcs = '';
      for (let i = 0; i < shown; i++) pcs += '<i class="pc c' + d + '" style="--i:' + i + '"></i>';
      cols += '<span class="col" style="--h:' + shown + '">' + pcs + '</span>';
    }
    return '<span class="stk">' + cols + '<b class="stk-amt">' + C.fmt(amount) + '</b></span>';
  };

  /* ---------- 數字跳動 ---------- */
  C.countUp = function (el, to, ms, fmt) {
    const f = fmt || (v => Math.round(v)), from = parseFloat(el.dataset.v) || 0, t0 = performance.now();
    cancelAnimationFrame(el._cu); ms = ms || 700;
    (function step(t) {
      const p = Math.min(1, (t - t0) / ms), v = from + (to - from) * C.ease.out3(p);
      el.textContent = f(v); el.dataset.v = v;
      if (p < 1) el._cu = requestAnimationFrame(step); else el.dataset.v = to;
    })(t0);
  };

  /* ---------- 版面縮放：每個遊戲以固定「設計尺寸」排版，再依舞台 (寬 × 高) 等比縮放 → 1920×1080 一屏看完，不需捲動 ---------- */
  C.fitView = function (view, W) {
    const scene = document.createElement('div'); scene.className = 'vscene';
    while (view.firstChild) scene.appendChild(view.firstChild);
    view.appendChild(scene); scene.style.width = W + 'px';
    return function () {
      const host = view.parentElement, mob = window.innerWidth <= 900;
      const aw = host.clientWidth, ah = host.clientHeight; if (!aw) return;
      scene.style.transform = 'none';
      const h = scene.offsetHeight;
      const s = Math.min(aw / W, mob ? 1.3 : ah / h, 1.9);
      const offY = mob ? 0 : Math.max(0, (ah - h * s) / 2);
      scene.style.transform = 'translate(-50%,' + offY + 'px) scale(' + s + ')';
      view.style.height = mob ? Math.ceil(h * s) + 6 + 'px' : '';
    };
  };

  /* ---------- 機箱視角：固定角度 (不再隨滑鼠晃動) ---------- */
  C.tilt = function (host, cab, o) {
    o = o || {};

  };

  /* ---------- 大獎特效 ---------- */
  C.coinRain = function (n, parent) {

      const c = document.createElement('i'); c.className = 'rain-coin';

    }
  };
  C.bigWin = function (title, amount) {
    const d = document.createElement('div'); d.className = 'bigwin';
    d.innerHTML = '<div class="bw-in"><small>' + title + '</small><b>' + C.fmt(amount) + '</b></div>';
    document.body.appendChild(d); C.coinRain(46, d); C.sfx('bigwin');
    setTimeout(() => d.classList.add('out'), 2600); setTimeout(() => d.remove(), 3300);
  };
  /* 依贏得倍數決定音效 / 大獎動畫 */
  C.celebrate = function (win, bet) {
    if (win >= bet * 100) C.bigWin('MEGA WIN', win);
    else if (win >= bet * 25) C.bigWin('BIG WIN', win);
    else if (win > 0) C.sfx('win');
  };


  /* ---------- 下注簿 (輪盤 / 骰寶共用)：下注即扣款，可復原 / 清除 / 重複上局 ---------- */
  C.betBook = function (onChange) {
    const B = { bets: {}, stack: [], last: null, locked: false };
    const fire = () => { try { onChange && onChange(B); } catch (e) { console.error(e); } };
    B.total = () => Object.values(B.bets).reduce((a, b) => a + b, 0);
    B.add = function (key) {
      if (B.locked) return false;
      const a = C.state.chip; if (!C.spend(a)) return false;
      B.bets[key] = (B.bets[key] || 0) + a; B.stack.push([key, a]); C.sfx('chip'); fire(); return true;
    };
    B.undo = function () {
      if (B.locked || !B.stack.length) return;
      const [k, a] = B.stack.pop(); B.bets[k] -= a; if (B.bets[k] <= 0) delete B.bets[k];
      C.earn(a); C.sfx('chip'); fire();
    };
    B.clear = function () {
      if (B.locked) return; const t = B.total(); B.bets = {}; B.stack = []; if (t) { C.earn(t); C.sfx('chips'); } fire();
    };
    B.rebet = function () {
      if (B.locked || !B.last) return;
      B.clear(); const t = Object.values(B.last).reduce((a, b) => a + b, 0);
      if (!C.spend(t)) return;
      B.bets = Object.assign({}, B.last); B.stack = Object.entries(B.bets); C.sfx('chips'); fire();
    };
    B.commit = function () { B.last = Object.assign({}, B.bets); };
    B.reset = function () { B.bets = {}; B.stack = []; fire(); };
    return B;
  };

  /* ---------- 遊戲註冊 ---------- */
  C.register = g => C.games.push(g);
})();

<script>
/* audio.js — Web Audio 合成音效 (無外部檔案) */
(function () {
  'use strict';
  const S = (window.Casino.Sound = { enabled: true });
  let ctx = null, master = null, noiseBuf = null;
  const loops = {};

  function init() {
    if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return ctx; }
    try {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      master = ctx.createGain(); master.gain.value = 0.6; master.connect(ctx.destination);
      const len = ctx.sampleRate;
      noiseBuf = ctx.createBuffer(1, len, ctx.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    } catch (e) { ctx = null; }
    return ctx;
  }
  ['pointerdown', 'keydown', 'touchstart'].forEach(ev => document.addEventListener(ev, init, { passive: true }));

  function tone(f, dur, o) {
    o = o || {};
    const t = ctx.currentTime + (o.at || 0);
    const osc = ctx.createOscillator(), g = ctx.createGain();
    osc.type = o.type || 'sine';
    osc.frequency.setValueAtTime(f, t);
    if (o.to) osc.frequency.exponentialRampToValueAtTime(o.to, t + dur);
    const v = o.vol == null ? 0.15 : o.vol;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(v, t + (o.attack || 0.005));
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(g); g.connect(master);
    osc.start(t); osc.stop(t + dur + 0.02);
  }
  function noise(dur, o) {
    o = o || {};
    const t = ctx.currentTime + (o.at || 0);
    const src = ctx.createBufferSource(); src.buffer = noiseBuf;
    const flt = ctx.createBiquadFilter();
    flt.type = o.type || 'bandpass'; flt.Q.value = o.q || 1;
    flt.frequency.setValueAtTime(o.f || 2000, t);
    if (o.to) flt.frequency.exponentialRampToValueAtTime(o.to, t + dur);
    const g = ctx.createGain();
    g.gain.setValueAtTime(o.vol == null ? 0.2 : o.vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(flt); flt.connect(g); g.connect(master);
    src.start(t, Math.random() * 0.5); src.stop(t + dur + 0.02);
  }

  const bank = {
    chip() { noise(0.05, { f: 3200, q: 2, vol: 0.35 }); tone(1900, 0.05, { type: 'triangle', vol: 0.07 }); },
    chips() { for (let i = 0; i < 4; i++) { noise(0.04, { f: 2800 + i * 300, q: 2, vol: 0.28, at: i * 0.045 }); } },
    card() { noise(0.09, { f: 900, to: 3500, q: 0.8, vol: 0.28 }); },
    flip() { noise(0.07, { f: 2500, q: 0.7, vol: 0.2 }); tone(300, 0.05, { type: 'triangle', vol: 0.05 }); },
    dice() { for (let i = 0; i < 9; i++) { noise(0.035, { f: 1400 + Math.random() * 1600, q: 3, vol: 0.3, at: i * 0.07 + Math.random() * 0.03 }); tone(260 + Math.random() * 200, 0.04, { type: 'square', vol: 0.04, at: i * 0.07 }); } },
    tick() { tone(1200, 0.025, { type: 'square', vol: 0.05 }); },
    ball() { tone(880 + Math.random() * 300, 0.05, { type: 'triangle', vol: 0.12 }); noise(0.03, { f: 4000, vol: 0.15 }); },
    reelstop() { tone(140, 0.12, { type: 'sine', vol: 0.3, to: 60 }); noise(0.07, { f: 600, vol: 0.3 }); },
    lever() { tone(90, 0.25, { type: 'sawtooth', vol: 0.12, to: 45 }); noise(0.18, { f: 500, to: 150, vol: 0.2 }); },
    button() { tone(520, 0.05, { type: 'square', vol: 0.06 }); noise(0.03, { f: 3000, vol: 0.15 }); },
    deny() { tone(180, 0.18, { type: 'sawtooth', vol: 0.1, to: 120 }); },
    coin(at) { tone(1318, 0.09, { vol: 0.1, at: at || 0 }); tone(1760, 0.22, { vol: 0.1, at: (at || 0) + 0.07 }); },
    coins() { for (let i = 0; i < 10; i++) bank.coin(i * 0.07); },
    win() { [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tone(f, 0.28, { type: 'triangle', vol: 0.13, at: i * 0.09 })); },
    lose() { tone(330, 0.25, { type: 'triangle', vol: 0.08, to: 220 }); },
    bigwin() {
      [523.25, 659.25, 783.99, 1046.5, 783.99, 1046.5, 1318.5].forEach((f, i) => tone(f, 0.35, { type: 'triangle', vol: 0.14, at: i * 0.12 }));
      for (let i = 0; i < 18; i++) bank.coin(0.4 + i * 0.09);
    },
    bell() { tone(1568, 0.9, { vol: 0.12 }); tone(2349, 0.7, { vol: 0.07 }); }
  };

  S.play = function (name, arg) {
    if (!S.enabled) return;
    if (!init()) return;
    try { bank[name] && bank[name](arg); } catch (e) {}
  };

  S.loop = function (name, on) {
    if (!init()) return;
    if (on && S.enabled && !loops[name]) {
      const o = ctx.createOscillator(), o2 = ctx.createOscillator(), f = ctx.createBiquadFilter(), g = ctx.createGain(), lfo = ctx.createOscillator(), lg = ctx.createGain();
      o.type = 'sawtooth'; o.frequency.value = 84; o2.type = 'square'; o2.frequency.value = 126;
      f.type = 'lowpass'; f.frequency.value = 520;

      o.start(); o2.start(); lfo.start();

    } else if (!on && loops[name]) {
      const l = loops[name]; delete loops[name];
      l.g.gain.cancelScheduledValues(ctx.currentTime);
      l.g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.2);
      setTimeout(() => { try { l.o.stop(); l.o2.stop(); l.lfo.stop(); } catch (e) {} }, 260);
    }
  };

  S.toggle = function () {
    S.enabled = !S.enabled;
    if (!S.enabled) Object.keys(loops).forEach(k => S.loop(k, false));
    return S.enabled;
  };

  /* ---- 供其他模組使用的簡短介面 ---- */
  const C = window.Casino;
  bank.thunk = bank.reelstop;
  bank.click = function () { tone(760, 0.035, { type: 'square', vol: 0.04 }); };

  bank.whoosh = function () { noise(0.5, { f: 300, to: 2400, q: 0.6, vol: 0.18 }); };
  C.sfx = (name, arg) => S.play(name, arg);
  C.sfxLoop = function () { S.loop('reel', true); return { stop: () => S.loop('reel', false) }; };
  C.toggleSound = function () {
    const on = S.toggle(), b = document.getElementById('btn-sound');
    if (b) b.textContent = on ? '🔊' : '🔇';
  };
})();

/* cards.js — 撲克牌 3D 渲染 (標準牌面 pip 排列)、翻牌與發牌飛行動畫 */
(function () {
  'use strict';
  const C = window.Casino;
  const K = (window.Cards = {});

  K.SUIT = { S: '♠︎', H: '♥︎', D: '♦︎', C: '♣︎' };      // 附 U+FE0E 強制文字樣式 (避免變成 emoji)
  const FACE = { 11: 'J', 12: 'Q', 13: 'K', 14: 'A' };
  K.label = r => FACE[r] || String(r);
  K.isRed = c => c.s === 'H' || c.s === 'D';
  K.name = c => K.label(c.r) + K.SUIT[c.s];

  /* 發牌靴：n 副牌洗勻，剩餘不足時自動重洗 */
  K.shoe = function (n) {
    n = n || 1;
    const s = { cards: [], draw() { if (this.cards.length < 12) this.fill(); return this.cards.pop(); }, fill() {
      const d = [];
      for (let k = 0; k < n; k++) for (const su of ['S', 'H', 'D', 'C']) for (let r = 2; r <= 14; r++) d.push({ r, s: su });
      this.cards = C.shuffle(d);
    } };
    s.fill();
    return s;
  };

  const t = 1 / 3;
  const PIPS = {
    2: [[.5, 0], [.5, 1]],
    3: [[.5, 0], [.5, .5], [.5, 1]],
    4: [[0, 0], [1, 0], [0, 1], [1, 1]],
    5: [[0, 0], [1, 0], [.5, .5], [0, 1], [1, 1]],
    6: [[0, 0], [1, 0], [0, .5], [1, .5], [0, 1], [1, 1]],
    7: [[0, 0], [1, 0], [.5, .25], [0, .5], [1, .5], [0, 1], [1, 1]],
    8: [[0, 0], [1, 0], [.5, .25], [0, .5], [1, .5], [.5, .75], [0, 1], [1, 1]],
    9: [[0, 0], [1, 0], [0, t], [1, t], [.5, .5], [0, 2 * t], [1, 2 * t], [0, 1], [1, 1]],
    10: [[0, 0], [1, 0], [.5, t / 2], [0, t], [1, t], [0, 2 * t], [1, 2 * t], [.5, 1 - t / 2], [0, 1], [1, 1]]
  };
  const COURT = { 11: '♞︎', 12: '♛︎', 13: '♚︎' };

  function faceHTML(c) {
    const su = K.SUIT[c.s], lb = K.label(c.r);
    const idx = '<div class="pc-idx tl"><b>' + lb + '</b><i>' + su + '</i></div><div class="pc-idx br"><b>' + lb + '</b><i>' + su + '</i></div>';

    return idx + body;
  }

  /* 建立一張牌 (card 可為 null → 只有牌背)。faceUp 預設 true */
  K.el = function (card, faceUp) {
    const d = document.createElement('div');
    d.className = 'pcard' + (card && K.isRed(card) ? ' red' : '') + (faceUp === false ? '' : ' up');
    d.innerHTML = '<div class="pc-in"><div class="pc-face">' + (card ? faceHTML(card) : '') + '</div><div class="pc-back"><span>♛</span></div></div>';
    d._card = card;

  };
  K.setFace = function (el, card) {
    el._card = card; el.classList.toggle('red', K.isRed(card));

  };
  K.flip = function (el, up) {
    if (up === undefined) up = !el.classList.contains('up');

  K.planePos = function (el, root) {
    let x = 0, y = 0, e = el;
    while (e && e !== root) { x += e.offsetLeft; y += e.offsetTop; e = e.offsetParent; }
    return { x, y };
  };
  K.fly = function (el, from, root, o) {
    o = o || {};
    const a = K.planePos(from, root), b = K.planePos(el, root);
    el.animate([

<script>
/* poker-eval.js — 牌型判定：5/7 張 (德州)、3 張牌、螢幕撲克 (含百搭二) */
(function () {
  'use strict';
  const P = (window.PokerEval = {});
  const NAMES = ['高牌', '一對', '兩對', '三條', '順子', '同花', '葫蘆', '四條', '同花順', '皇家同花順'];
  P.NAMES = NAMES;

  const enc = (cat, tb) => { let s = cat; for (let i = 0; i < 5; i++) s = s * 15 + (tb[i] || 0); return s; };

  function groupsOf(r) {
    const cnt = {};
    r.forEach(x => cnt[x] = (cnt[x] || 0) + 1);
    return Object.entries(cnt).map(([k, v]) => [+k, v]).sort((a, b) => b[1] - a[1] || b[0] - a[0]);
  }

  P.eval5 = function (h) {
    const r = h.map(c => c.r).sort((a, b) => b - a);
    const flush = h.every(c => c.s === h[0].s);
    let sh = 0;
    if (new Set(r).size === 5) {
      if (r[0] - r[4] === 4) sh = r[0];
      else if (r[0] === 14 && r[1] === 5 && r[4] === 2) sh = 5;
    }
    const g = groupsOf(r);
    let cat, tb;
    if (sh && flush) { cat = 8; tb = [sh]; }
    else if (g[0][1] === 4) { cat = 7; tb = [g[0][0], g[1][0]]; }
    else if (g[0][1] === 3 && g[1][1] === 2) { cat = 6; tb = [g[0][0], g[1][0]]; }
    else if (flush) { cat = 5; tb = r; }
    else if (sh) { cat = 4; tb = [sh]; }
    else if (g[0][1] === 3) { cat = 3; tb = g.map(x => x[0]); }
    else if (g[0][1] === 2 && g[1][1] === 2) { cat = 2; tb = g.map(x => x[0]); }
    else if (g[0][1] === 2) { cat = 1; tb = g.map(x => x[0]); }
    else { cat = 0; tb = r; }
    const nm = (cat === 8 && sh === 14) ? 9 : cat;
    return { cat, tb, score: enc(cat, tb), name: NAMES[nm], nameIdx: nm };
  };

  /* 5~7 張取最佳 5 張 */
  P.best = function (cards) {
    if (cards.length === 5) { const e = P.eval5(cards); e.cards = cards; return e; }
    let best = null;
    const n = cards.length;
    const pick = (start, acc) => {
      if (acc.length === 5) {
        const e = P.eval5(acc);
        if (!best || e.score > best.score) { best = e; best.cards = acc.slice(); }
        return;
      }
      for (let i = start; i < n; i++) { acc.push(cards[i]); pick(i + 1, acc); acc.pop(); }
    };
    pick(0, []);
    return best;
  };

  /* ---------- 三張牌撲克 ---------- */
  const N3 = ['高牌', '一對', '同花', '順子', '三條', '同花順'];
  P.eval3 = function (h) {
    const r = h.map(c => c.r).sort((a, b) => b - a);
    const flush = h.every(c => c.s === h[0].s);
    let sh = 0;
    if (new Set(r).size === 3) {
      if (r[0] - r[2] === 2) sh = r[0];
      else if (r[0] === 14 && r[1] === 3 && r[2] === 2) sh = 3;
    }
    const g = groupsOf(r);
    let cat, tb;
    if (sh && flush) { cat = 5; tb = [sh]; }
    else if (g[0][1] === 3) { cat = 4; tb = [g[0][0]]; }
    else if (sh) { cat = 3; tb = [sh]; }
    else if (flush) { cat = 2; tb = r; }
    else if (g[0][1] === 2) { cat = 1; tb = g.map(x => x[0]); }
    else { cat = 0; tb = r; }
    return { cat, tb, score: enc(cat, tb), name: N3[cat] };
  };

  /* ---------- 螢幕撲克 ---------- */
  const ROWS = {
    jacks: [
      ['royal', '皇家同花順', 250], ['sf', '同花順', 50], ['quads', '四條', 25], ['fh', '葫蘆', 9], ['flush', '同花', 6],
      ['straight', '順子', 4], ['trips', '三條', 3], ['twopair', '兩對', 2], ['jacks', 'J 以上一對', 1]
    ],
    bonus: [
      ['royal', '皇家同花順', 250], ['sf', '同花順', 50], ['quadA', '四條 A', 80], ['quad24', '四條 2-4', 40], ['quad5K', '四條 5-K', 25],
      ['fh', '葫蘆', 8], ['flush', '同花', 5], ['straight', '順子', 4], ['trips', '三條', 3], ['twopair', '兩對', 2], ['jacks', 'J 以上一對', 1]
    ],
    deuces: [
      ['natroyal', '天然皇家同花順', 800], ['fourdeuces', '四張 2', 200], ['wildroyal', '百搭皇家同花順', 25], ['five', '五條', 15],
      ['sf', '同花順', 9], ['quads', '四條', 5], ['fh', '葫蘆', 3], ['flush', '同花', 2], ['straight', '順子', 2], ['trips', '三條', 1]
    ]
  };
  P.VP = {};
  Object.keys(ROWS).forEach(k => { P.VP[k] = ROWS[k].map(r => ({ key: r[0], name: r[1], mult: r[2] })); });

  function evalDeuces(hand) {
    const wild = hand.filter(c => c.r === 2).length;
    const nw = hand.filter(c => c.r !== 2);
    if (wild === 4) return 'fourdeuces';
    const cnt = {};
    nw.forEach(c => cnt[c.r] = (cnt[c.r] || 0) + 1);
    const counts = Object.values(cnt).sort((a, b) => b - a);
    const m = counts[0] || 0;
    const suited = nw.every(c => c.s === nw[0].s);
    const noDup = Object.keys(cnt).length === nw.length;
    const fit = s => nw.every(c => (c.r >= s && c.r <= s + 4) || (c.r === 14 && s === 1));
    const anyFit = () => { for (let s = 1; s <= 10; s++) if (fit(s)) return true; return false; };
    if (wild === 0 && suited && noDup && fit(10)) return 'natroyal';
    if (wild > 0 && suited && noDup && fit(10)) return 'wildroyal';
    if (wild + m >= 5) return 'five';
    if (suited && noDup && anyFit()) return 'sf';
    if (wild + m >= 4) return 'quads';
    if (Math.max(0, 3 - (counts[0] || 0)) + Math.max(0, 2 - (counts[1] || 0)) <= wild && (counts[0] || 0) <= 3) return 'fh';
    if (suited) return 'flush';
    if (noDup && anyFit()) return 'straight';
    if (wild + m >= 3) return 'trips';
    return null;
  }

  P.videoPoker = function (hand, variant) {
    const table = P.VP[variant];
    let key = null;
    if (variant === 'deuces') key = evalDeuces(hand);
    else {
      const e = P.eval5(hand);
      if (e.nameIdx === 9) key = 'royal';
      else if (e.cat === 8) key = 'sf';
      else if (e.cat === 7) {
        if (variant === 'bonus') { const q = e.tb[0]; key = q === 14 ? 'quadA' : (q <= 4 ? 'quad24' : 'quad5K'); }
        else key = 'quads';
      }
      else if (e.cat === 6) key = 'fh';
      else if (e.cat === 5) key = 'flush';
      else if (e.cat === 4) key = 'straight';
      else if (e.cat === 3) key = 'trips';
      else if (e.cat === 2) key = 'twopair';
      else if (e.cat === 1 && e.tb[0] >= 11) key = 'jacks';
    }
    const row = key && table.find(r => r.key === key);
    return row ? { key, name: row.name, mult: row.mult } : { key: null, name: '未成牌', mult: 0 };
  };
})();

</script>
